
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 18px;
      background: #f4f6f8;
      color: #222;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 18px;
    }

    .panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 6px;
    }

    input, select, textarea, button {
      width: 100%;
      font: inherit;
      padding: 12px;
      border-radius: 7px;
    }

    input, select, textarea {
      border: 1px solid #bbb;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 75px;
    }

    button {
      border: none;
      background: #1769aa;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .secondary { background: #555; }

    #reader {
      width: 100%;
      margin-top: 12px;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      background: #e8eef5;
      overflow-wrap: anywhere;
    }

    .success {
      background: #d9f3df !important;
      color: #14532d;
    }

    .error {
      background: #ffe1e1 !important;
      color: #8b1515;
    }

    .hint {
      color: #555;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <h1>Inventory Barcode Scanner</h1>

  <div class="panel">
    <button id="startCamera" type="button">Start Scanner</button>
    <div id="reader"></div>

    <p class="hint">
      Scan a barcode with your camera or enter the barcode manually.
    </p>

    <form id="transactionForm">
      <label for="barcode">Barcode</label>
      <input id="barcode" name="barcode" type="text"
             autocomplete="off" required>

      <label for="action">Transaction Type</label>
      <select id="action" name="action" required>
        <option value="OUT">OUT — Remove from inventory</option>
        <option value="IN">IN — Add to inventory</option>
      </select>

      <label for="quantity">Quantity</label>
      <input id="quantity" name="quantity" type="number"
             min="0.000001" step="any" value="1" required>

      <label for="notes">Notes (optional)</label>
      <textarea id="notes" name="notes"
                placeholder="Enter notes here"></textarea>

      <button id="submitButton" type="submit">Record Transaction</button>
      <button id="clearButton" class="secondary" type="button">
        Clear Form
      </button>
    </form>

    <div id="status" role="status" aria-live="polite">
      Ready to scan.
    </div>
  </div>

  <script>
    const BACKEND_URL =
      'https://script.google.com/macros/s/AKfycbztT2Lu8JUmjvPJ6rOZyV-nnFlbuS2j0I0dVnSyGA3ogvDTlAzn7Y8QRVVHiPUjWcM/exec';

    const form = document.getElementById('transactionForm');
    const barcodeInput = document.getElementById('barcode');
    const actionInput = document.getElementById('action');
    const quantityInput = document.getElementById('quantity');
    const notesInput = document.getElementById('notes');
    const submitButton = document.getElementById('submitButton');
    const startCameraButton = document.getElementById('startCamera');
    const clearButton = document.getElementById('clearButton');
    const statusBox = document.getElementById('status');

    let scanner = null;
    let scannerRunning = false;
    let pendingRequestId = null;
    let requestTimeout = null;
    let requestScript = null;
    let lastScannedCode = '';

    function showStatus(message, type = '') {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    function makeRequestId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return 'req_' + Date.now() + '_' +
        Math.random().toString(36).slice(2, 12);
    }

    function stopPendingRequest() {
      if (requestTimeout) {
        clearTimeout(requestTimeout);
        requestTimeout = null;
      }

      if (requestScript) {
        requestScript.onerror = null;
        requestScript.remove();
        requestScript = null;
      }

      // Keep the global callback defined.
      // Removing it while a response is executing can hide the result.
    }

    async function startScanner() {
      if (scannerRunning) return;

      if (typeof Html5Qrcode === 'undefined') {
        showStatus(
          'The scanner library failed to load. Reload the page and try again.',
          'error'
        );
        return;
      }

      try {
        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        showStatus('Starting camera...');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 250, height: 150 },
            aspectRatio: 1.5
          },
          async decodedText => {
            const code = String(decodedText).trim();

            if (!code || code === lastScannedCode) return;

            lastScannedCode = code;
            barcodeInput.value = code;

            showStatus(
              'Barcode scanned. Verify the item and record the transaction.'
            );

            if (scannerRunning) {
              try {
                await scanner.pause(true);
              } catch (e) {}
            }
          },
          () => {}
        );

        scannerRunning = true;
        startCameraButton.textContent = 'Scanner Running';
        showStatus('Camera ready. Point it at a barcode.');
      } catch (error) {
        showStatus(
          'Could not start the camera. Check camera permission and HTTPS. ' +
          (error.message || ''),
          'error'
        );
      }
    }

    async function resumeScanner() {
      lastScannedCode = '';

      if (!scanner || !scannerRunning) return;

      try {
        await scanner.resume();
        showStatus('Camera ready. Point it at a barcode.');
      } catch (error) {
        showStatus(
          'Transaction form is ready. Tap Start Scanner to restart the camera.'
        );
      }
    }

    function resetForm() {
      form.reset();
      actionInput.value = 'OUT';
      quantityInput.value = '1';
      barcodeInput.value = '';
      notesInput.value = '';
      lastScannedCode = '';
      showStatus('Form cleared. Ready to scan.');
      barcodeInput.focus();
    }

    function handleTransactionResponse(result) {
      if (!pendingRequestId) return;

      const expectedRequestId = pendingRequestId;

      if (!result || result.requestId !== expectedRequestId) {
        pendingRequestId = null;
        stopPendingRequest();
        submitButton.disabled = false;

        showStatus(
          'A response arrived, but its request ID did not match. ' +
          'Check Log and On Hand quantities before retrying.',
          'error'
        );
        return;
      }

      stopPendingRequest();
      pendingRequestId = null;
      submitButton.disabled = false;

      if (result.success === true) {
        showStatus(
          result.message || 'Transaction recorded successfully.',
          'success'
        );
        resetForm();
        resumeScanner();
      } else {
        showStatus(
          result.message || 'Transaction failed.',
          'error'
        );
      }
    }

    // Expose the callback for Apps Script JSONP responses.
    window.handleTransactionResponse = handleTransactionResponse;

    form.addEventListener('submit', event => {
      event.preventDefault();

      if (pendingRequestId) {
        showStatus(
          'A transaction request is already pending. Wait for its response.',
          'error'
        );
        return;
      }

      const barcode = barcodeInput.value.trim();
      const action = actionInput.value;
      const quantity = quantityInput.value;
      const notes = notesInput.value.trim();

      if (!barcode) {
        showStatus('Please scan or enter a barcode.', 'error');
        return;
      }

      if (!['IN', 'OUT'].includes(action)) {
        showStatus('Choose IN or OUT.', 'error');
        return;
      }

      if (!Number.isFinite(Number(quantity)) || Number(quantity) <= 0) {
        showStatus('Quantity must be greater than zero.', 'error');
        return;
      }

      const requestId = makeRequestId();
      pendingRequestId = requestId;

      submitButton.disabled = true;
      showStatus('Submitting transaction. Please wait...');

      const params = new URLSearchParams({
        tx: '1',
        callback: 'handleTransactionResponse',
        requestId: requestId,
        barcode: barcode,
        action: action,
        quantity: quantity,
        notes: notes
      });

      requestScript = document.createElement('script');
      requestScript.async = true;
      requestScript.src = BACKEND_URL + '?' + params.toString();

      requestScript.onerror = () => {
        if (pendingRequestId !== requestId) return;

        stopPendingRequest();
        pendingRequestId = null;
        submitButton.disabled = false;

        showStatus(
          'The browser failed to load the Apps Script response. ' +
          'The transaction outcome is unknown. Check Log and On Hand ' +
          'before retrying.',
          'error'
        );
      };

      requestTimeout = setTimeout(() => {
        if (pendingRequestId !== requestId) return;

        stopPendingRequest();
        pendingRequestId = null;
        submitButton.disabled = false;

        showStatus(
          'Timed out waiting for Apps Script. The transaction outcome ' +
          'is unknown. Check Log and On Hand before retrying.',
          'error'
        );
      }, 20000);

      document.body.appendChild(requestScript);
    });

    clearButton.addEventListener('click', () => {
      if (pendingRequestId) {
        showStatus(
          'A transaction is pending. Wait for the response before clearing.',
          'error'
        );
        return;
      }

      resetForm();
    });

    startCameraButton.addEventListener('click', startScanner);

    window.addEventListener('beforeunload', () => {
      stopPendingRequest();

      if (scanner && scannerRunning) {
        scanner.stop().catch(() => {});
      }
    });
  </script>
</body>
</html>
